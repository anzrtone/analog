# Copyright (c) 2026 The Analog contributors
# Builds the shipping artifacts:
#   • Windows installer (.exe via NSIS, plus .msi) and a portable Analog-portable.exe
#   • Android APK (signed if the keystore secrets exist, otherwise a sideloadable debug APK)
# Push a tag like v0.2.0 to also publish them as a GitHub Release with SHA256SUMS.txt.
# Analog makes no network requests at build time. At run time it only goes online for things the user opts in to (the GitHub release check, device sync, the anonymous survey).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item src-tauri/target/release/analog.exe out/Analog-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: analog-windows
          path: out/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version
        run: |
          echo "ANALOG_VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "ANALOG_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/analog.jks
          echo "ANALOG_KEYSTORE=$RUNNER_TEMP/analog.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          ANALOG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANALOG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANALOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANALOG_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Analog-${ANALOG_VERSION_NAME}.apk
          else
            echo "::warning::No signing secrets set; building a debug-signed APK (installs fine, but can't be updated by a release-signed build)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Analog-${ANALOG_VERSION_NAME}-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: analog-android
          path: Analog-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's#\./[^/]*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Verify your download against `SHA256SUMS.txt` (Windows: `certutil -hashfile <file> SHA256`).
            Android: allow "Install unknown apps" for your browser, then open the .apk.
