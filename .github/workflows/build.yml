# Copyright (c) 2026 The Analog contributors
# Builds the shipping artifacts:
#   • Windows installer (.exe via NSIS, plus .msi) and a portable Analog-portable.exe
#   • Android APK (signed if the keystore secrets exist, otherwise a sideloadable debug APK)
# Push a tag like v0.2.0 to also publish them as a GitHub Release with SHA256SUMS.txt and build attestations.
# A tag build refuses to publish without release signing: a debug-signed APK never reaches a release.
# Actions are pinned to full commit SHAs, because a tag can be moved. Dependabot proposes updates.
# Analog makes no network requests at build time. At run time it only goes online for things the user opts in to (the GitHub release check, device sync, the anonymous survey).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi -- --locked
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item src-tauri/target/release/analog.exe out/Analog-portable.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analog-windows
          path: out/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Refuse to release without signing
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 isn't set, so this tag can't produce a release-signed APK."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Runs before anything executes gradle-wrapper.jar, a committed binary, in a job that can hold the keystore.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version
        run: |
          echo "ANALOG_VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "ANALOG_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/analog.jks
          echo "ANALOG_KEYSTORE=$RUNNER_TEMP/analog.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          ANALOG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANALOG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANALOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANALOG_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Analog-${ANALOG_VERSION_NAME}.apk
          else
            echo "::warning::No signing secrets set; building a debug-signed APK (installs fine, but can't be updated by a release-signed build)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Analog-${ANALOG_VERSION_NAME}-debug.apk
          fi
      - name: Check the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk="Analog-${ANALOG_VERSION_NAME}.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          certs="$("$tools/apksigner" verify --print-certs "$apk")"
          badging="$("$tools/aapt" dump badging "$apk")"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::$apk is signed with a debug key."
            exit 1
          fi
          if grep -q 'application-debuggable' <<< "$badging"; then
            echo "::error::$apk is debuggable, which exposes app data through run-as."
            exit 1
          fi
          grep 'certificate SHA-256' <<< "$certs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analog-android
          path: Analog-*.apk

  # Separate from `release`, so no job holds both the signing identity and write access to the repo.
  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*/*

  # Uses the runner's own gh, so no third-party action runs with write access.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist }
      - name: Checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's#\./[^/]*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Verify your download against `SHA256SUMS.txt` (Windows: `certutil -hashfile <file> SHA256`).
            To check it was built here from this tag: `gh attestation verify <file> --repo ${{ github.repository }}`.
            Android: allow "Install unknown apps" for your browser, then open the .apk.
        run: |
          mapfile -d '' files < <(find dist -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$NOTES"
